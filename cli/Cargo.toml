[package]
name = "oshihub"
version = "0.5.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
open = "5"
viuer = "0.11"
image = "0.25"
crossterm = { version = "0.29", features = ["event-stream"] }
toml = "1.1.3"
dirs = "6.0.0"
colored = "3.1.1"
ratatui = { version = "0.30.2", features = ["crossterm"] }
# `default-features = false`: the crate's default pulls in `chafa-dyn`, an
# optional C-library ASCII-art backend needing `libchafa`/pkg-config on the
# system — kitty/iTerm2/Sixel/halfblocks (the protocols actually in use here)
# are native Rust, not gated behind it. `crossterm` matches the backend
# feature already enabled on `ratatui` itself above.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
anyhow = "1.0.104"
futures-util = "0.3"
